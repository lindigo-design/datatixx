# Dependabot раз на тиждень пропонує оновлення бібліотек (особливо з латками безпеки)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      keystatic:
        patterns: ['@keystatic/*']
    # Великі стрибки версій (6 → 7) не пропонувати: вони можуть ламати збірку.
    # Дрібні оновлення й латки безпеки приходитимуть як і раніше.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
