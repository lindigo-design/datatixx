# To better understand this file read this:
# https://docs.ionos.space/docs/github-actions-customization/

name: "Deploy Now: Execute Build"

on:
  workflow_call:
    inputs:
      site-url:
        required: true
        type: string
      branch-id:
        required: true
        type: string

env:
  DEPLOYMENT_FOLDER: dist

jobs:
# Please do not rename this job
  build-project:
    name: build datatixx
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: v22.x

      - name: Build Node assets
        env:
          CI: true
        
          SITE_URL: ${{ inputs.site-url }}
        run: |
          npm ci
          npm run build

      # Шаблони з .deploy-now/datatixx (напр. api/_smtp_password.template) → у dist.
      # Без цього кроку «Render templates» у deploy-to-ionos.yaml нічого не підставляє
      # (він обробляє лише файли зі списку .template-renderer-data, який створює цей крок).
      - name: Render templates
        uses: ionos-deploy-now/template-renderer-action@v2
        with:
          input-directory: .deploy-now/datatixx
          output-directory: ${{ env.DEPLOYMENT_FOLDER }}
          intermediate-data-file: ${{ env.DEPLOYMENT_FOLDER }}/.template-renderer-data

# Please do not touch the following action
      - name: Store deployment content
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: cb400038-97f6-47b2-98fe-61c6d5210299
          branch-id: ${{ inputs.branch-id }}
          version: ${{ github.sha }}
          folder: ${{ env.DEPLOYMENT_FOLDER }}
          config-file: .deploy-now/datatixx/config.yaml
          action: upload
